[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llama31-8b-scratch"
version = "0.1.0"
description = "从零手写的工业级 Llama3.1 全流程实战：分词、预训练、SFT、对齐、评测、量化、部署"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "llama31-8b-scratch contributors" }]
keywords = ["llm", "llama3", "transformer", "rlhf", "dpo", "grpo", "from-scratch"]

dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "safetensors>=0.4",
]

[project.optional-dependencies]
model = [
    "transformers>=4.46",
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
    "einops>=0.7",
]
train = [
    "transformers>=4.46",
    "datasets>=2.19",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.9",
    "deepspeed>=0.14",
    "bitsandbytes>=0.43",
    "liger-kernel>=0.2",
    "wandb>=0.17",
    "tensorboard>=2.16",
]
quant = [
    "auto-gptq>=0.7",
    "autoawq>=0.2",
    "bitsandbytes>=0.43",
    "optimum>=1.19",
]
deploy = [
    "vllm>=0.5",
    "sglang>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "gradio>=4.26",
    "openai>=1.30",
    "httpx>=0.27",
]
eval = [
    "lm-eval>=0.4.4",
    "evaluate>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

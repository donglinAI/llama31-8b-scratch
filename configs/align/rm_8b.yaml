# ============================================================
# 奖励模型（RM）8B 真机配置：Llama 3.1 8B backbone + 标量打分头
# 用途：在多卡 GPU 上对大规模偏好数据做 Bradley-Terry 成对训练
# 默认硬件假设：单节点 8×A100/H100 级别，bf16，梯度检查点开启
# ============================================================
_base_: ../model/llama3.1_8b.yaml

seed: 42

data:
  train_path: data/align/rm_train.jsonl
  eval_path: data/align/rm_eval.jsonl

align:
  method: rm
  margin: 0.0

trainer:
  output_dir: outputs/align/rm_8b
  learning_rate: 1.0e-6
  batch_size: 8
  max_steps: -1
  num_train_epochs: 1
  gradient_accumulation_steps: 4
  logging_steps: 10
  save_steps: 500
  weight_decay: 0.0
  max_length: 4096
  bf16: true
  gradient_checkpointing: true

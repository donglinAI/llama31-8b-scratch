# ============================================================
# DPO CPU 冒烟配置：极小模型 + 真实偏好对，验证手写 DPO 训练前向/反向
# 论文：Rafailov et al., 2023, Direct Preference Optimization
# 默认硬件假设：单卡 CPU，batch_size=2，短序列
# ============================================================
_base_: ../model/smoke.yaml

seed: 42

tokenizer:
  path: outputs/tokenizer/smoke

data:
  train_file: data/toy/preference.jsonl   # schema: prompt/chosen/rejected
  seq_len: 64

align:
  method: dpo
  beta: 0.1                  # 隐式奖励温度 β
  label_smoothing: 0.0       # 标签平滑 ε，0 表示关闭

training:
  output_dir: outputs/align/dpo_smoke
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 10
  learning_rate: 1.0e-4
  weight_decay: 0.0
  adam_betas: [0.9, 0.95]
  adam_eps: 1.0e-8
  max_grad_norm: 1.0
  mixed_precision: no
  logging_steps: 2
  save_steps: 10
  save_total_limit: 1
  report_to: none
  project_name: llama31-8b-scratch-dpo
  run_name: smoke
  dataloader_num_workers: 0

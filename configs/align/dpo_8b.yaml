# ============================================================
# DPO 8B 真机配置：Llama 3.1 8B 策略模型 + 冻结参考模型
# 论文：Rafailov et al., 2023, Direct Preference Optimization
# 默认硬件假设：单节点 8×A100/H100，bf16，可叠加 LoRA（peft 惰性接入）
# ============================================================
_base_: ../model/llama3.1_8b.yaml

seed: 42

data:
  train_path: data/align/dpo_train.jsonl
  eval_path: data/align/dpo_eval.jsonl

align:
  method: dpo
  beta: 0.1
  label_smoothing: 0.0
  loss_type: sigmoid
  max_length: 4096
  max_prompt_length: 2048
  use_lora: true             # 工业常用：LoRA 微调，peft 惰性导入
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

trainer:
  output_dir: outputs/align/dpo_8b
  learning_rate: 5.0e-7
  batch_size: 4
  max_steps: -1
  num_train_epochs: 1
  gradient_accumulation_steps: 8
  logging_steps: 10
  save_steps: 500
  weight_decay: 0.0
  bf16: true
  gradient_checkpointing: true
